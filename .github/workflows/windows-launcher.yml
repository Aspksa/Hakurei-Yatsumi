name: Windows BAT and Node Gateway v3
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        folder: ["ordinary", "unicode", "mapped"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check PowerShell 5.1 syntax
        shell: powershell
        run: |
          $files = @('scripts/setup-and-start.ps1','scripts/stop.ps1','scripts/watchdog.ps1','scripts/tray.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Host; throw "Invalid syntax: $file" }
          }
      - name: Python tests and Node syntax
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r backend/requirements.txt
          python -m pytest tests -q
          node --check frontend/server.js
          cd frontend
          npm ci --no-audit --no-fund
          npm test
      - name: Stage path scenarios
        shell: powershell
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'Yatsumi Test'
          if ('${{ matrix.folder }}' -eq 'unicode') { $base = Join-Path $env:RUNNER_TEMP "Яцуми (тест) O'Brien" }
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Copy-Item -Destination $base -Recurse -Force
          if ('${{ matrix.folder }}' -eq 'mapped') {
            cmd /c "subst P: `"$base`""
            if ($LASTEXITCODE -ne 0) { throw 'subst failed' }
            $base='P:\'
          }
          $base | Set-Content -LiteralPath "$env:RUNNER_TEMP\project-path.txt"
      - name: Start, check tray, recover and stop
        shell: powershell
        run: |
          $root = Get-Content -LiteralPath "$env:RUNNER_TEMP\project-path.txt" -Raw
          $root = $root.Trim()
          & (Join-Path $root 'Hakurei-Yatsumi.bat') -NoBrowser
          if ($LASTEXITCODE -ne 0) { throw 'BAT launch failed' }
          $state = Join-Path $root 'logs\services.json'
          $original = Get-Content -LiteralPath $state -Raw | ConvertFrom-Json
          $trayState = Join-Path $root 'logs\tray.json'
          $tray = Get-Content -LiteralPath $trayState -Raw | ConvertFrom-Json
          $trayProcess = Get-Process -Id $tray.pid
          & (Join-Path $root 'Hakurei-Yatsumi.bat') -NoBrowser -Offline
          if ($LASTEXITCODE -ne 0) { throw 'Repeated offline launch failed' }
          $repeated = Get-Content -LiteralPath $state -Raw | ConvertFrom-Json
          if ($repeated.node.pid -ne $original.node.pid -or $repeated.python.pid -ne $original.python.pid) {
            throw 'Repeated launch replaced healthy services'
          }
          $repeatedTray = Get-Content -LiteralPath $trayState -Raw | ConvertFrom-Json
          if ($repeatedTray.pid -ne $tray.pid -or $trayProcess.HasExited) {
            throw 'Repeated launch replaced the tray process'
          }
          if ('${{ matrix.folder }}' -eq 'ordinary') {
            Stop-Process -Id $original.node.pid -Force
            $recovered = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $current = Get-Content -LiteralPath $state -Raw | ConvertFrom-Json
                $health = Invoke-WebRequest 'http://127.0.0.1:3000/gateway/health' -UseBasicParsing -TimeoutSec 2
                if ($current.node.pid -ne $original.node.pid -and $health.StatusCode -eq 200) {
                  $recovered = $true
                  break
                }
              } catch {}
            }
            if (-not $recovered) { throw 'Watchdog did not restart the gateway' }
            if ($trayProcess.HasExited) { throw 'Tray stopped during watchdog recovery' }
          }
          & (Join-Path $root 'scripts\stop.ps1') -ProjectRoot $root
          if ($LASTEXITCODE -ne 0) { throw 'Stop failed' }
          if ((Test-Path -LiteralPath $trayState) -or -not $trayProcess.WaitForExit(10000)) {
            throw 'Tray did not exit after services stopped'
          }
          if ('${{ matrix.folder }}' -eq 'mapped') { cmd /c 'subst P: /D' }
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-v3-${{ matrix.folder }}
          path: |
            ${{ runner.temp }}/Yatsumi Test/logs/*.log
            ${{ runner.temp }}/Яцуми (тест) O'Brien/logs/*.log
            ${{ github.workspace }}/logs/*.log
          if-no-files-found: ignore

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        timeout-minutes: 4
        run: npx playwright install chromium
      # Системные пакеты (в основном шрифты) ставятся через apt. Если зеркала Ubuntu недоступны,
      # шаг не должен вешать всю проверку: Chromium работает и с библиотеками, уже имеющимися на раннере.
      - name: Install system dependencies (best effort)
        working-directory: frontend
        timeout-minutes: 3
        continue-on-error: true
        run: npx playwright install-deps chromium
      - name: Browser UI tests
        working-directory: frontend
        timeout-minutes: 5
        run: npm run test:e2e
